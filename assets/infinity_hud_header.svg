<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#070b12; border-radius:16px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04070d" />
      <stop offset="50%" stop-color="#09131f" />
      <stop offset="100%" stop-color="#040912" />
    </linearGradient>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <radialGradient id="reactorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0" />
      <stop offset="100%" stop-color="#00f3ff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Embedded CSS Keyframe Animations -->
    <style>
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseCore {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #00f3ff); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes waveBar {
        0%, 100% { height: 8px; y: 44px; }
        50% { height: 38px; y: 14px; }
      }
      @keyframes blinkText {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes scanGrid {
        0% { transform: translateY(-40px); opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { transform: translateY(40px); opacity: 0.15; }
      }
      @keyframes hudTrace {
        0% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }

      .spin-cw { transform-origin: 210px 210px; animation: spinCW 14s linear infinite; }
      .spin-ccw { transform-origin: 210px 210px; animation: spinCCW 9s linear infinite; }
      .spin-slow { transform-origin: 210px 210px; animation: spinCW 26s linear infinite; }
      .pulse-core { transform-origin: 210px 210px; animation: pulseCore 3s ease-in-out infinite; }
      .radar-sweep { transform-origin: 210px 210px; animation: radarSweep 4s linear infinite; }
      .blink { animation: blinkText 2s ease-in-out infinite; }
      .trace-line { stroke-dasharray: 80, 20; animation: hudTrace 6s linear infinite; }
      
      .bar-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
      .bar-2 { animation: waveBar 0.9s ease-in-out infinite 0.3s; }
      .bar-3 { animation: waveBar 1.5s ease-in-out infinite 0.0s; }
      .bar-4 { animation: waveBar 1.1s ease-in-out infinite 0.4s; }
      .bar-5 { animation: waveBar 1.3s ease-in-out infinite 0.2s; }
      .bar-6 { animation: waveBar 0.8s ease-in-out infinite 0.5s; }
      .bar-7 { animation: waveBar 1.4s ease-in-out infinite 0.15s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12" stroke="#00f3ff" stroke-width="0.75">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
  </g>

  <!-- Sci-Fi Corner Bracket Crosshairs -->
  <g stroke="#00f3ff" stroke-width="2" fill="none" opacity="0.7">
    <!-- Top Left -->
    <path d="M 24 60 L 24 24 L 60 24" />
    <circle cx="24" cy="24" r="3" fill="#00f3ff" />
    <!-- Top Right -->
    <path d="M 1140 24 L 1176 24 L 1176 60" />
    <circle cx="1176" cy="24" r="3" fill="#00f3ff" />
    <!-- Bottom Left -->
    <path d="M 24 360 L 24 396 L 60 396" />
    <circle cx="24" cy="396" r="3" fill="#00f3ff" />
    <!-- Bottom Right -->
    <path d="M 1140 396 L 1176 396 L 1176 360" />
    <circle cx="1176" cy="396" r="3" fill="#00f3ff" />
  </g>

  <!-- ================= ARC REACTOR / INFINITY OCULUS ================= -->
  <g transform="translate(0, 0)">
    <!-- Radial Ambient Glow -->
    <circle cx="210" cy="210" r="190" fill="url(#reactorGlow)" />
    <circle cx="210" cy="210" r="120" fill="url(#goldGlow)" />

    <!-- Outermost Dial Ring with Ticks -->
    <circle cx="210" cy="210" r="165" stroke="#00f3ff" stroke-width="1.2" fill="none" stroke-opacity="0.35" />
    <circle cx="210" cy="210" r="156" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-dasharray="8 14" stroke-opacity="0.45" class="spin-slow" />

    <!-- Counter-rotating segmented telemetry ring -->
    <circle cx="210" cy="210" r="142" stroke="#00f3ff" stroke-width="3" fill="none" stroke-dasharray="32 16 12 16 64 20" class="spin-ccw" filter="url(#glow)" />
    <circle cx="210" cy="210" r="130" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-dasharray="10 25" stroke-opacity="0.6" class="spin-cw" />

    <!-- Sweeping Radar Sector -->
    <g class="radar-sweep">
      <path d="M 210 210 L 335 150 A 130 130 0 0 1 340 210 Z" fill="url(#sweepGrad)" />
      <line x1="210" y1="210" x2="340" y2="210" stroke="#00f3ff" stroke-width="2" filter="url(#glow)" />
    </g>

    <!-- Middle Concentric Tech Ring -->
    <circle cx="210" cy="210" r="105" stroke="#00f3ff" stroke-width="1.8" fill="none" stroke-dasharray="6 6" stroke-opacity="0.5" />
    <circle cx="210" cy="210" r="92" stroke="#0284c7" stroke-width="3.5" fill="none" stroke-dasharray="70 30" class="spin-cw" />
    
    <!-- Inner Core & Infinity Triangulation Rings -->
    <circle cx="210" cy="210" r="74" stroke="#fbbf24" stroke-width="2" fill="none" stroke-dasharray="45 15" stroke-opacity="0.8" class="spin-ccw" />
    <circle cx="210" cy="210" r="58" stroke="#00f3ff" stroke-width="3" fill="#041221" filter="url(#strongGlow)" class="pulse-core" />
    
    <!-- Central Glowing Infinity Symbol -->
    <g filter="url(#strongGlow)">
      <path d="M 182 210 C 182 198, 196 198, 204 206 L 216 214 C 224 222, 238 222, 238 210 C 238 198, 224 198, 216 206 L 204 214 C 196 222, 182 222, 182 210 Z" 
            fill="none" stroke="url(#cyanGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="210" cy="210" r="3.5" fill="#ffffff" />
    </g>

    <!-- Crosshair Reticle lines -->
    <line x1="210" y1="36" x2="210" y2="60" stroke="#00f3ff" stroke-width="2" />
    <line x1="210" y1="360" x2="210" y2="384" stroke="#00f3ff" stroke-width="2" />
    <line x1="36" y1="210" x2="60" y2="210" stroke="#00f3ff" stroke-width="2" />
    <line x1="360" y1="210" x2="384" y2="210" stroke="#00f3ff" stroke-width="2" />
  </g>

  <!-- ================= CENTRAL TITLES & BRANDING ================= -->
  <g transform="translate(420, 0)">
    
    <!-- System Classification Top Banner -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="168" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#00f3ff" stroke-width="1" />
      <circle cx="14" cy="12" r="4" fill="#00f3ff" class="blink" />
      <text x="26" y="16" fill="#00f3ff" font-family="'Segoe UI', 'Roboto', monospace" font-size="11" font-weight="700" letter-spacing="2">MARK VII // ACTIVE</text>

      <rect x="180" y="0" width="190" height="24" rx="4" fill="#d97706" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1" />
      <circle cx="194" cy="12" r="4" fill="#fbbf24" />
      <text x="206" y="16" fill="#fbbf24" font-family="'Segoe UI', 'Roboto', monospace" font-size="11" font-weight="700" letter-spacing="1.5">MULTI-MODAL CORE</text>
    </g>

    <!-- Main Title: INFINITY -->
    <text x="0" y="145" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="76" font-weight="900" letter-spacing="8" fill="url(#cyanGold)" filter="url(#strongGlow)">
      INFINITY
    </text>

    <!-- Subtitle: J.A.R.V.I.S. MARK VII -->
    <text x="4" y="195" font-family="'Segoe UI', 'Roboto', monospace" font-size="28" font-weight="700" letter-spacing="6" fill="#ffffff" opacity="0.95">
      J.A.R.V.I.S. <tspan fill="#00f3ff">MARK VII</tspan>
    </text>

    <!-- Technical Descriptor -->
    <text x="4" y="232" font-family="'Segoe UI', 'Roboto', sans-serif" font-size="14.5" font-weight="400" letter-spacing="1.2" fill="#94a3b8">
      Intelligent Multi-Modal Desktop AI Assistant with Computer Vision
    </text>
    <text x="4" y="254" font-family="'Segoe UI', 'Roboto', sans-serif" font-size="14.5" font-weight="400" letter-spacing="1.2" fill="#94a3b8">
      Gesture Telemetry, Real-Time Voice Synthesis &amp; Deep Windows Automation
    </text>

    <!-- Decorative HUD Accent Divider Line -->
    <g transform="translate(0, 274)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.4" />
      <line x1="0" y1="0" x2="160" y2="0" stroke="#fbbf24" stroke-width="2.5" class="trace-line" />
      <circle cx="480" cy="0" r="3" fill="#00f3ff" />
    </g>

    <!-- Feature Pillars Tags -->
    <g transform="translate(0, 305)" font-family="'Segoe UI', 'Roboto', monospace" font-size="12" font-weight="600">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#0c1d2e" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="18" fill="#38bdf8">🔮 10+ Hand Gestures</text>
      <!-- Tag 2 -->
      <rect x="172" y="0" width="168" height="28" rx="6" fill="#0c1d2e" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" />
      <text x="186" y="18" fill="#38bdf8">⚡ WhatsApp Neural</text>
      <!-- Tag 3 -->
      <rect x="352" y="0" width="158" height="28" rx="6" fill="#0c1d2e" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.4" />
      <text x="366" y="18" fill="#38bdf8">🎙️ Voice &amp; Edge TTS</text>
    </g>

    <g transform="translate(0, 345)" font-family="'Segoe UI', 'Roboto', monospace" font-size="12" font-weight="600">
      <!-- Tag 4 -->
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#0c1d2e" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
      <text x="14" y="18" fill="#fbbf24">📊 Auto PPTX &amp; PDF</text>
      <!-- Tag 5 -->
      <rect x="172" y="0" width="168" height="28" rx="6" fill="#0c1d2e" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
      <text x="186" y="18" fill="#fbbf24">🛰️ Win32 Telemetry</text>
      <!-- Tag 6 -->
      <rect x="352" y="0" width="158" height="28" rx="6" fill="#0c1d2e" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
      <text x="366" y="18" fill="#fbbf24">💎 Futuristic HUD</text>
    </g>
  </g>

  <!-- ================= RIGHT PANEL: LIVE TELEMETRY & AUDIO WAVE ================= -->
  <g transform="translate(980, 50)">
    <!-- Telemetry Card Box -->
    <rect x="0" y="0" width="190" height="315" rx="10" fill="#06101c" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.4" />
    <path d="M 0 16 L 16 0 L 190 0 L 190 315 L 0 315 Z" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Card Header -->
    <text x="16" y="30" fill="#00f3ff" font-family="'Segoe UI', monospace" font-size="12" font-weight="700" letter-spacing="1.5">TELEMETRY STATS</text>
    <line x1="16" y1="42" x2="174" y2="42" stroke="#00f3ff" stroke-width="1" stroke-opacity="0.3" />

    <!-- Status Indicators -->
    <g transform="translate(16, 62)" font-family="'Segoe UI', monospace" font-size="11">
      <text x="0" y="0" fill="#64748b">VISION CV:</text>
      <text x="120" y="0" fill="#10b981" font-weight="700">60 FPS</text>

      <text x="0" y="24" fill="#64748b">LANDMARKS:</text>
      <text x="120" y="24" fill="#00f3ff" font-weight="700">21 PTS</text>

      <text x="0" y="48" fill="#64748b">LLM ENGINE:</text>
      <text x="120" y="48" fill="#fbbf24" font-weight="700">ONLINE</text>

      <text x="0" y="72" fill="#64748b">TTS VOICE:</text>
      <text x="120" y="72" fill="#38bdf8" font-weight="700">ACTIVE</text>

      <text x="0" y="96" fill="#64748b">PORT 7777:</text>
      <text x="120" y="96" fill="#10b981" font-weight="700">LISTENING</text>
    </g>

    <!-- Audio Frequency Waveform Visualizer -->
    <g transform="translate(18, 190)">
      <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', monospace" font-size="10" letter-spacing="1">AUDIO SPECTRUM</text>
      
      <!-- Equalizer Bars -->
      <g fill="#00f3ff" opacity="0.85">
        <rect x="0" width="8" rx="2" class="bar-1" />
        <rect x="14" width="8" rx="2" class="bar-2" />
        <rect x="28" width="8" rx="2" class="bar-3" />
        <rect x="42" width="8" rx="2" class="bar-4" fill="#38bdf8" />
        <rect x="56" width="8" rx="2" class="bar-5" fill="#38bdf8" />
        <rect x="70" width="8" rx="2" class="bar-6" fill="#fbbf24" />
        <rect x="84" width="8" rx="2" class="bar-7" fill="#fbbf24" />
        <rect x="98" width="8" rx="2" class="bar-3" fill="#38bdf8" />
        <rect x="112" width="8" rx="2" class="bar-2" fill="#00f3ff" />
        <rect x="126" width="8" rx="2" class="bar-5" fill="#00f3ff" />
        <rect x="140" width="8" rx="2" class="bar-1" fill="#00f3ff" />
      </g>
    </g>

    <!-- Batch / Security Signature -->
    <g transform="translate(16, 280)" font-family="'Segoe UI', monospace" font-size="10">
      <line x1="0" y1="0" x2="158" y2="0" stroke="#00f3ff" stroke-width="0.8" stroke-opacity="0.3" />
      <text x="0" y="16" fill="#64748b">BATCH: <tspan fill="#e2e8f0">21CS15</tspan></text>
      <text x="96" y="16" fill="#10b981" font-weight="700">ENCRYPTED</text>
    </g>
  </g>
</svg>
