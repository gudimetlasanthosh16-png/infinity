<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" style="background:#050b14; border-radius:32px;">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes spinBadge {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseBadge {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 8px #00f3ff); }
      }
      .spin { transform-origin: 32px 32px; animation: spinBadge 8s linear infinite; }
      .pulse { transform-origin: 32px 32px; animation: pulseBadge 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="320" height="64" rx="32" fill="#07111e" stroke="#00f3ff" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Mini Arc Reactor Core -->
  <circle cx="32" cy="32" r="22" stroke="#00f3ff" stroke-width="1.5" fill="none" stroke-dasharray="6 4" class="spin" />
  <circle cx="32" cy="32" r="15" stroke="#fbbf24" stroke-width="2" fill="#041221" class="pulse" />
  <circle cx="32" cy="32" r="6" fill="#00f3ff" filter="url(#badgeGlow)" />

  <!-- Badge Text -->
  <text x="68" y="28" font-family="'Segoe UI', 'Roboto', monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">TELEMETRY SYSTEM</text>
  <text x="68" y="47" font-family="'Segoe UI', 'Roboto', sans-serif" font-size="15" font-weight="800" fill="url(#badgeGrad)" letter-spacing="2">INFINITY ONLINE</text>

  <!-- Live Pulse Dot -->
  <circle cx="290" cy="32" r="5" fill="#10b981" />
  <circle cx="290" cy="32" r="9" stroke="#10b981" stroke-width="1.2" fill="none" opacity="0.6" />
</svg>
